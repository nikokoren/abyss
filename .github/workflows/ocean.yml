name: Process and publish ocean stills
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - trmnl/**
      - abyss/recipe.py
      - abyss/about.py
      - abyss/cli.py
      - abyss/publication.py
      - scripts/build_site.py
      - docs/viewer.html
      - sources.json
      - abyss/adapters.py
      - abyss/stills.py
      - abyss/search.py
      - abyss/pipeline.py
      - abyss/imaging.py
      - abyss/video.py
      - abyss/media_page.py
      - abyss/retention.py
      - scripts/persist_output.py
      - .github/workflows/ocean.yml
      - pyproject.toml
  schedule:
    - cron: '23 */3 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ocean-publication
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TORCH_HOME: ${{ github.workspace }}/.torch-cache
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/install_vision.sh
      - uses: actions/cache@v4
        with:
          path: .torch-cache/hub/checkpoints
          key: resnet18-imagenet1k-v1-f37072fd
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e .
      - name: Check deployment configuration
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          python - <<'PYCODE'
          import os
          from urllib.parse import urlsplit
          value = os.environ.get('PUBLIC_BASE_URL', '')
          parsed = urlsplit(value)
          if parsed.scheme != 'https' or not parsed.netloc or parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit('Set PUBLIC_BASE_URL to the actual public Pages HTTPS URL')
          PYCODE
      - name: Restore durable last-good output and processing history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          # Exit 2 is an absent first-run branch; auth/network errors must fail.
          set +e
          git ls-remote --exit-code origin refs/heads/ocean-output > /tmp/ocean-ref
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin refs/heads/ocean-output:refs/remotes/origin/ocean-output
            git archive FETCH_HEAD | tar -x -C output
          elif [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          python - <<'PYCODE'
          from datetime import datetime, timezone
          from pathlib import Path
          from abyss.publication import atomic_json, read_json
          from abyss.registry import load
          previous = {s['id']: read_json(Path('output/state') / (s['id'] + '.json'), {}) for s in load('sources.json')}
          atomic_json('output/state/previous-sources.json', {'saved_at': datetime.now(timezone.utc).isoformat(), 'sources': previous})
          PYCODE
      - name: Restore personal preference model when available
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code origin refs/heads/preference-data > /tmp/preference-ref
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin refs/heads/preference-data:refs/remotes/origin/preference-data
            if git cat-file -e origin/preference-data:model.json 2>/dev/null; then
              git show origin/preference-data:model.json > /tmp/ocean-preference-model.json
              if python - <<'PYCODE'
          from abyss.preferences import load_model
          raise SystemExit(0 if load_model('/tmp/ocean-preference-model.json') else 1)
          PYCODE
              then
                if ! bash scripts/install_vision.sh; then
                  echo 'Vision installation failed; processing will attempt the quality fallback.' >&2
                fi
              fi
            fi
          elif [ "$status" -ne 2 ]; then
            exit "$status"
          fi
      - name: Process validated sources
        id: pipeline
        continue-on-error: true
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          test -n "$PUBLIC_BASE_URL" || { echo 'Set PUBLIC_BASE_URL to the actual Pages HTTPS URL'; exit 1; }
          python -m abyss.cli run --base-url "$PUBLIC_BASE_URL" --preference-model /tmp/ocean-preference-model.json
      - name: Generate recipe and site
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          if python -m abyss.cli recipe --base-url "$PUBLIC_BASE_URL"; then
            cp output/recipe/settings.yml output/public/settings.yml
          else
            rm -f output/public/settings.yml
            echo 'No eligible recipe export; inspect health.json and source validation.'
          fi
          python scripts/build_site.py
          python -m abyss.cli retain --base-url "$PUBLIC_BASE_URL"
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          r = json.loads(Path('output/state/retention.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## Image retention\n\nPublished bundle: {r['after_bytes'] / 1024**2:.1f} MiB / {r['budget_bytes'] / 1024**2:.0f} MiB. Retired {r['deleted_files']} old assets; protected current images and session winners. QR observation pages retained.\n")
          PYCODE
      - name: Persist bounded generated snapshot with an exact branch lease
        run: python scripts/persist_output.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/public
      - uses: actions/deploy-pages@v4
      - name: Report processing failure after retaining last-good delivery
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo 'Processing did not complete; last-good images and health diagnostics were published.'
          exit 1
