name: Build preference review gallery
on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/review-gallery.yml
      - abyss/review.py
      - abyss/preferences.py
      - web/review/**
      - scripts/install_vision.sh
permissions:
  contents: write
concurrency:
  group: preference-state
  cancel-in-progress: false
jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PREFERENCE_REVIEWER: ${{ vars.PREFERENCE_REVIEWER || github.repository_owner }}
      TORCH_HOME: ${{ github.workspace }}/.torch-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/install_vision.sh
      - uses: actions/cache@v4
        with:
          path: .torch-cache/hub/checkpoints
          key: resnet18-imagenet1k-v1-f37072fd
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
          bash scripts/install_vision.sh
      - name: Restore preference data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/preference-state
          set +e
          git ls-remote --exit-code origin refs/heads/preference-data > /tmp/preference-ref
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin refs/heads/preference-data:refs/remotes/origin/preference-data
            git archive origin/preference-data | tar -x -C /tmp/preference-state
          elif [ "$status" -ne 2 ]; then
            exit "$status"
          fi
      - name: Refresh current preference model without inventing feedback
        run: |
          python scripts/preference_feedback.py --state /tmp/preference-state --reviewer "$PREFERENCE_REVIEWER"
      - name: Generate real candidate comparisons
        run: |
          python -m abyss.review --reviewer "$PREFERENCE_REVIEWER" \
            --preference-model /tmp/preference-state/model.json --output /tmp/abyss-review
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          report = json.loads(Path('/tmp/abyss-review/gallery-report.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Your preference gallery is ready\n\nDownload **abyss-review-gallery** below, unzip it, and open `index.html`.\n\nChoose A, B, or neither. Submit the prefilled GitHub issues to store feedback and train in the cloud.\n\n')
              summary.write(f"Candidates: {report['candidate_count']}. Batch: `{report['batch_id']}`. No public Pages publication.\n")
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: abyss-review-gallery
          path: |
            /tmp/abyss-review/index.html
            /tmp/abyss-review/gallery-report.json
          retention-days: 30
          if-no-files-found: error
      - name: Persist trusted feature manifest (no images)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/abyss-review/manifest.json').read_text())
          destination = Path('/tmp/preference-state/batches')
          destination.mkdir(parents=True, exist_ok=True)
          (destination / (manifest['batch_id'] + '.json')).write_text(json.dumps(manifest, indent=2))
          PYCODE
          cp /tmp/abyss-review/gallery-report.json /tmp/preference-state/gallery-report.json
          if git show-ref --verify --quiet refs/remotes/origin/preference-data; then
            git checkout --detach refs/remotes/origin/preference-data
          else
            git checkout --orphan preference-data
            git rm -rf --ignore-unmatch .
          fi
          cp -a /tmp/preference-state/. .
          git add batches gallery-report.json model.json training-report.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Save trusted preference review features'
          git push origin HEAD:refs/heads/preference-data
