name: Recheck Oregon cameras with native previews
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/review_oregon_native.py
      - .github/workflows/review-oregon-native.yml
permissions:
  contents: write
concurrency:
  group: oregon-native-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: python -m pip install -e . -r requirements-dev.txt
      - uses: actions/checkout@v4
        with:
          repository: usetrmnl/trmnl-framework
          ref: f366a9303bbce97adca73d5747da8e2212379bbc
          path: output/framework
          sparse-checkout: |
            public/css/3.4.4
            public/js/3.4.4
            public/fonts
      - run: python -m playwright install --with-deps chromium
      - name: Sample fresh footage and render native-layout previews
        run: python scripts/review_oregon_native.py --framework-root output/framework --output /tmp/oregon-native-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oregon-native-preview-review
          path: /tmp/oregon-native-review/
          retention-days: 14
      - name: Preserve attributed previews and technical evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/oregon-native-review/report.json
          set +e
          git ls-remote --exit-code origin refs/heads/camera-native-review > /tmp/oregon-review-ref
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin refs/heads/camera-native-review:refs/remotes/origin/camera-native-review
            git checkout --detach refs/remotes/origin/camera-native-review
          elif [ "$status" -eq 2 ]; then
            git checkout --orphan camera-native-review
            git rm -rf --ignore-unmatch .
          else
            exit "$status"
          fi
          mkdir -p "reviews/${GITHUB_RUN_ID}"
          cp -a /tmp/oregon-native-review/. "reviews/${GITHUB_RUN_ID}/"
          cp /tmp/oregon-native-review/report.json reviews/latest.json
          git add reviews
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record fresh Oregon camera native-preview review'
          git push origin HEAD:refs/heads/camera-native-review
